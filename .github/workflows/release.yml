name: Release

# Fires when a `v*.*.*` tag is pushed.
# Flow:
#   1. run the complete Node matrix and live Postgres integration suite
#   2. verify the tag matches package.json and inspect the npm payload
#   3. stage npm via short-lived Trusted Publishing (OIDC — no npm token)
#   4. wait for malware scanning plus a maintainer's explicit 2FA approval
#   5. fetch the GitHub auto-generated source tarball, compute sha256
#   6. patch Formula/scope.rb (url + sha256)
#   7. push the formula into briannadoubt/homebrew-tap
#   8. create a GitHub release with the install snippet
#   9. call the hosted deployment workflow only after release succeeds
#
# Required repo secrets:
#   HOMEBREW_TAP_DEPLOY_KEY    SSH private key whose pubkey is a write-enabled
#                              deploy key on briannadoubt/homebrew-tap

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run docs:agent:check
      - run: npm test

  postgres-integration:
    name: Verify Postgres (Node 22)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scope
          POSTGRES_PASSWORD: scope
          POSTGRES_DB: scope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scope -d scope_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SCOPE_PG_URL: postgres://scope:scope@localhost:5432/scope_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

  release:
    needs: [verify, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write     # create GitHub release
      id-token: write     # short-lived npm OIDC credential + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package.json
        id: meta
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          npm ci
          node bin/scope.js --version
          node bin/scope.js --help | head -5
          npm pack --dry-run

      - name: Use staged-publishing capable npm
        run: npm install --global npm@12.0.2

      - name: Stage npm package with OIDC
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$(npm view "scope-kanban@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "scope-kanban@${VERSION} is already public; skipping staging."
          else
            npm stage publish --provenance --access public
          fi

      - name: Wait for npm malware scan and maintainer 2FA approval
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          echo "Approve scope-kanban@${VERSION} from npm's Staged Packages view after its scan completes."
          for attempt in $(seq 1 240); do
            PUBLISHED="$(npm view "scope-kanban@${VERSION}" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "scope-kanban@${VERSION} is public."
              exit 0
            fi
            if [ $((attempt % 20)) -eq 0 ]; then
              echo "Still awaiting npm approval (${attempt}/240 checks)."
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for scope-kanban@${VERSION} approval on npm."
          exit 1

      - name: Fetch sha256 of GitHub source tarball
        id: sha
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          # GitHub serves these on-demand once the tag exists — should be instant
          # but a few retries are cheap insurance.
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" -o /tmp/src.tar.gz; then break; fi
            echo "Tarball not yet available (attempt $i) — retrying in 3s..."
            sleep 3
          done
          if [ ! -s /tmp/src.tar.gz ]; then
            echo "::error::Could not fetch $URL"
            exit 1
          fi
          SHA="$(sha256sum /tmp/src.tar.gz | awk '{print $1}')"
          echo "url=$URL"       >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"    >> "$GITHUB_OUTPUT"
          echo "sha256: $SHA"

      - name: Patch local Formula/scope.rb
        env:
          URL: ${{ steps.sha.outputs.url }}
          SHA: ${{ steps.sha.outputs.sha256 }}
        run: |
          sed -i -E "s|^( *url +).*|\\1\"$URL\"|" Formula/scope.rb
          sed -i -E "s|^( *sha256 +).*|\\1\"$SHA\"|" Formula/scope.rb
          cat Formula/scope.rb

      - name: Load tap deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Sync formula into briannadoubt/homebrew-tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth=1 \
            git@github.com:briannadoubt/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp Formula/scope.rb tap/Formula/scope.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/scope.rb
          if git diff --cached --quiet; then
            echo "Tap formula already up to date, nothing to push."
          else
            git commit -m "scope v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            **Homebrew (macOS / Linuxbrew):**

            ```
            brew install briannadoubt/tap/scope
            brew upgrade scope
            ```

            **npm / npx:**

            ```
            npm install -g scope-kanban
            npx scope-kanban --help
            ```

  deploy:
    name: Deploy hosted hub
    needs: release
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
